[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbreaker"
version = "0.1.0"
description = "Automated red-teaming for LLM agents"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "httpx>=0.27.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
    "langfuse>=2.0.0,<3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "pygithub>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[project.scripts]
agentbreaker = "agentbreaker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agentbreaker"]
